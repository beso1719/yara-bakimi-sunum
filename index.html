<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yara Bakımında Hemşirelik Eğitimi</title>
<meta name="description" content="Yara bakımı eğitim sunumu, canlı sınıf sınavı ve sonuç analizi.">
<meta name="theme-color" content="#060A12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23060A12'/%3E%3Cpath d='M18 32h28M32 18v28' stroke='%232DD4BF' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:ital,wght@0,400..800;1,400..600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/deck.css">
<link rel="stylesheet" href="css/quiz.css">
<link rel="stylesheet" href="css/analytics.css">
</head>
<body class="deck-body">
<canvas id="bg" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div id="viewport">
  <main id="stage" aria-live="polite"></main>
</div>

<!-- Üst/alt arayüz -->
<header id="hud" class="hud">
  <div class="hud-chapter"><span id="hud-num" class="mono">01</span><span id="hud-title">Giriş</span></div>
  <div class="hud-actions">
    <button class="icon-btn" data-act="menu" aria-label="Bölümler (M)" title="Bölümler (M)"><i data-lucide="layout-list"></i></button>
    <button class="icon-btn" data-act="overview" aria-label="Genel bakış (O)" title="Genel bakış (O)"><i data-lucide="layout-grid"></i></button>
    <button class="icon-btn" data-act="notes" aria-label="Konuşmacı notları (N)" title="Konuşmacı notları (N)"><i data-lucide="sticky-note"></i></button>
    <button class="icon-btn" data-act="remote" aria-label="Telefondan kumanda" title="Telefondan kumanda"><i data-lucide="smartphone"></i></button>
    <button class="icon-btn" data-act="sound" aria-label="Ses aç/kapa" title="Ses (A)"><i data-lucide="volume-2"></i></button>
    <button class="icon-btn" data-act="theme" aria-label="Açık/koyu tema (T)" title="Tema (T)"><i data-lucide="sun-moon"></i></button>
    <button class="icon-btn" data-act="fullscreen" aria-label="Tam ekran (F)" title="Tam ekran (F)"><i data-lucide="maximize"></i></button>
  </div>
</header>
<footer id="foot" class="foot">
  <button class="nav-btn" data-act="prev" aria-label="Önceki"><i data-lucide="chevron-left"></i></button>
  <div id="progress" class="progress" aria-hidden="true"></div>
  <span id="counter" class="mono counter">1 / 1</span>
  <button class="nav-btn" data-act="next" aria-label="Sonraki"><i data-lucide="chevron-right"></i></button>
</footer>

<aside id="notes" class="notes" hidden>
  <div class="notes-head"><strong>Konuşmacı notu</strong><button class="icon-btn" data-act="notes" aria-label="Kapat"><i data-lucide="x"></i></button></div>
  <div id="notes-body"></div>
</aside>

<div id="menu" class="overlay" hidden>
  <div class="overlay-card">
    <div class="overlay-head"><h2>Bölümler</h2><button class="icon-btn" data-act="menu" aria-label="Kapat"><i data-lucide="x"></i></button></div>
    <div id="menu-list" class="menu-list"></div>
  </div>
</div>
<div id="overview" class="overlay" hidden>
  <div class="overlay-card wide">
    <div class="overlay-head"><h2>Genel bakış</h2><button class="icon-btn" data-act="overview" aria-label="Kapat"><i data-lucide="x"></i></button></div>
    <div id="overview-grid" class="overview-grid"></div>
  </div>
</div>
<div id="remote-pop" class="overlay" hidden>
  <div class="overlay-card narrow center">
    <div class="overlay-head"><h2>Telefondan kumanda</h2><button class="icon-btn" data-act="remote" aria-label="Kapat"><i data-lucide="x"></i></button></div>
    <p class="muted">Bu kodu yalnızca sunumu yönetecek kişi okutsun. Telefon ileri/geri tuşu olur.</p>
    <div id="remote-qr" class="qr-box"></div>
    <p id="remote-status" class="muted small"></p>
  </div>
</div>

<!-- Canlı sınav katmanı (sahne ölçeğinde) -->
<div id="quiz" class="quiz" hidden></div>
<!-- Analiz (tam sayfa, kaydırılabilir) -->
<section id="analysis" class="analysis" hidden></section>

<div id="laser" class="laser" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/fx.js"></script>
<script src="js/deck.js"></script>
<script src="js/scenes/a-giris.js"></script>
<script src="js/scenes/b-iyilesme.js"></script>
<script src="js/scenes/c-pansuman.js"></script>
<script src="js/scenes/d-basi.js"></script>
<script src="js/scenes/e-yanik.js"></script>
<script src="js/scenes/f-son.js"></script>
<script src="js/quiz-data.js"></script>
<script src="js/db.js"></script>
<script src="js/quiz-host.js"></script>
<script src="js/analytics.js"></script>
<script>Deck.boot();</script>
</body>
</html>
